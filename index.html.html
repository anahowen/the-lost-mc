#app{position:relative;z-index:1}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:15px/1.5 var(--f-body);
  padding:0;
}
.gut{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:30;background:var(--side)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.good{color:var(--good)} .bad{color:var(--bad)}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* buttons */
.btn{
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:3px;
  padding:10px 16px;font-weight:600;cursor:pointer;letter-spacing:.02em;
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--muted);filter:none}
.btn.sm{padding:5px 10px;font-size:13px}

var fdate=function(d){return String(d||'').split('-').reverse().join('/')};
var monthLabel=function(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)};

function fs(len,maxW,max){return Math.min(max,maxW/(len*0.6))}
function patchSVG(p){
  var gold=p.special,cls='pt'+(gold?' gold':'')+(p.rank?' rank':'');
  var gid='gd-'+p.id,defs='',bgStyle='';
  if(gold){
    defs='<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--gold-a)"/><stop offset=".55" style="stop-color:var(--gold-b)"/><stop offset="1" style="stop-color:var(--gold-a)"/></linearGradient></defs>';
    bgStyle=' style="fill:url(#'+gid+')"';
  }
  var body,w,h;
  if(p.shape==='round'){
    w=100;h=100;
    var two=!!p.l2,big=gold&&p.l2&&p.l2.length===1;
    body='<circle class="bg"'+bgStyle+' cx="50" cy="50" r="47"/><circle class="ed" cx="50" cy="50" r="47"/><circle class="st" cx="50" cy="50" r="40"/>'+
      (two?'<text x="50" y="'+(big?38:47)+'" font-size="'+fs(p.l1.length,64,big?17:20)+'">'+esc(p.l1)+'</text><text x="50" y="'+(big?78:72)+'" font-size="'+(big?46:fs(p.l2.length,64,20))+'">'+esc(p.l2)+'</text>'
          :'<text x="50" y="58" font-size="'+fs(p.l1.length,64,22)+'">'+esc(p.l1)+'</text>');
  }else if(p.shape==='rocker'){
    w=200;h=56;
    body='<rect class="bg"'+bgStyle+' x="2" y="2" width="196" height="52" rx="26"/><rect class="ed" x="2" y="2" width="196" height="52" rx="26"/><rect class="st" x="8" y="8" width="184" height="40" rx="20"/>'+
      '<text x="100" y="37" font-size="'+fs(p.l1.length,150,26)+'">'+esc(p.l1)+'</text>';
  }else{
    w=120;h=40;
    body='<rect class="bg"'+bgStyle+' x="2" y="2" width="116" height="36" rx="7"/><rect class="ed" x="2" y="2" width="116" height="36" rx="7"/><rect class="st" x="7" y="7" width="106" height="26" rx="4"/>'+
      '<text x="60" y="27" font-size="'+fs(p.l1.length,96,20)+'">'+esc(p.l1)+'</text>';
  }
  return '<svg class="'+cls+' pw-'+p.shape+'" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(p.nome)+'">'+defs+body+'</svg>';
}
function roleSVG(cargo){
  var long=cargo.length>12;
  return patchSVG({id:'rank',nome:cargo,shape:long?'rocker':'tab',l1:cargo,rank:true});
}
function chip(p){return '<div class="pchip">'+patchSVG(p)+'<span class="cap">'+esc(p.nome)+'</span></div>'}
function holders(id){return S.rows.members.filter(function(m){return (m.patches||[]).indexOf(id)>-1})}

/* ---------- data layer: shared db when available, per-browser storage otherwise ---------- */
var S={mode:'local',db:null,ready:false,rows:{members:[],products:[],cash:[],bau:[],pedidos:[]}};
var LS='lostmc.v2';
function lsLoad(){try{var r=localStorage.getItem(LS);return r?JSON.parse(r):null}catch(e){return null}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S.rows))}catch(e){toast('O armazenamento local encheu. Use fotos menores ou libere espaço.',true)}}
var find=function(c,id){return S.rows[c].find(function(r){return r.id===id})};

var room=null,online={},lastAnn=null;
function isTyping(a){return !!(a&&$('#view')&&$('#view').contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&!/^(checkbox|radio|button|file)$/.test(a.type||''))}
var dirty=false;
function softRender(){
  if(!sid)return;
  if(!U()){doLogout();return}
  renderPresence();
  var a=document.activeElement;
  if(isTyping(a)){dirty=true;return}
  renderView();
}
document.addEventListener('focusout',function(){if(dirty){dirty=false;setTimeout(function(){var a=document.activeElement;if(!isTyping(a))softRender()},50)}});

async function initStore(){
  var db=null;
  try{db=(window.claude&&window.claude.use)?await window.claude.use('db'):null}catch(e){db=null}
  if(db){
    S.mode='db';S.db=db;
    await new Promise(function(res){
      var left=COLS.length;
      COLS.forEach(function(c){
        var first=true;
        var done=function(){if(first){first=false;if(--left===0)res()}else{softRender()}};
        db.collection(c).onSnapshot(function(snap){
          S.rows[c]=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});
          done();
        },function(){done()});
      });
      setTimeout(res,6000);
    });
  }else{
    var l=lsLoad();
    if(l)COLS.forEach(function(c){S.rows[c]=l[c]||[]});
  }
  S.ready=true;
}
var api={
  add:async function(c,obj){
    var id=uid(),body=Object.assign({},obj,{createdAt:Date.now()});
    if(S.mode==='db'){await S.db.collection(c).doc(id).set(body)}
    else{S.rows[c].push(Object.assign({id:id},body));lsSave()}
    return id;
  },
  put:async function(c,id,patch){
    var cur=find(c,id);
    if(!cur)return;
    if(S.mode==='db'){var next=Object.assign({},cur,patch);delete next.id;await S.db.collection(c).doc(id).set(next)}
    else{Object.assign(cur,patch);lsSave()}
  },

async function hashPw(pw,saltHex){
  if(!(window.crypto&&crypto.subtle))throw new Error('Este navegador não suporta criptografia de senha.');
  var key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);

function resizePhoto(file){
  return new Promise(function(res,rej){
    if(!/^image\//.test(file.type))return rej(new Error('Escolha um arquivo de imagem.'));
    var fr=new FileReader();
    fr.onerror=function(){rej(new Error('Não foi possível ler a imagem.'))};
    fr.onload=function(){
      var img=new Image();
      img.onerror=function(){rej(new Error('Imagem inválida.'))};
      img.onload=function(){
        var size=320,c=document.createElement('canvas');c.width=size;c.height=size;
        var s=Math.min(img.width,img.height),sx=(img.width-s)/2,sy=(img.height-s)/2;
        c.getContext('2d').drawImage(img,sx,sy,s,s,0,0,size,size);
        res(c.toDataURL('image/jpeg',0.82));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function spark(){
  var n=30,keys=[],end=new Date();
  for(var i=n-1;i>=0;i--){var d=new Date(end);d.setDate(d.getDate()-i);keys.push(ymd(d))}
  var base=0,net={};
  S.rows.cash.forEach(function(x){
    var v=(x.tipo==='entrada'?1:-1)*(Number(x.valor)||0);
    if(x.data<keys[0])base+=v;else net[x.data]=(net[x.data]||0)+v;
  });
  var run=base,pts=keys.map(function(k){run+=(net[k]||0);return run});
  var min=Math.min.apply(null,pts),max=Math.max.apply(null,pts),span=(max-min)||1;
  var xy=pts.map(function(v,i){return [i*(300/(n-1)),56-((v-min)/span)*46]});
  var line=xy.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join('');
  var last=xy[xy.length-1];
  return '<svg class="spark" viewBox="0 0 300 64" role="img" aria-label="Saldo acumulado nos últimos 30 dias">'+
    '<line class="g" x1="0" x2="300" y1="10" y2="10"/><line class="g" x1="0" x2="300" y1="33" y2="33"/><line class="g" x1="0" x2="300" y1="56" y2="56"/>'+
    '<path class="a" d="'+line+'L300 64L0 64Z"/><path class="l" d="'+line+'"/><circle class="d" cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3.5"/></svg>';
}

function canOrders(){var u=U();return !!u&&rank(u.cargo)<=7}
function forSale(p){return p.venda===true||(p.venda===undefined&&Number(p.preco)>0)}
function r2(n){return Math.round((Number(n)||0)*100)/100}
function pTotal(o){return r2((o.itens||[]).reduce(function(a,i){return a+(Number(i.qtd)||0)*(Number(i.preco)||0)},0))}
function pAdiant(o){var t=0;S.rows.cash.forEach(function(c){if(c.pedidoId===o.id&&c.tipo==='entrada'&&c.id!==o.pagoCashId)t+=Number(c.valor)||0});return r2(t)}
function pRest(o){return Math.max(0,r2(pTotal(o)-pAdiant(o)))}
function pProntos(o){return (o.itens||[]).filter(function(i){return i.pronto}).length}
function pAberto(o){return !(o.entregue&&o.pago)}
function pNum(o){return '#'+String(o.numero||0).padStart(3,'0')}
function pedRef(id){var o=find('pedidos',id);return o?pNum(o):'(excluído)'}

    for(var i=0;i<P.length;i++)await api.add('products',{nome:P[i][0],cat:P[i][1],preco:P[i][2],qtd:P[i][3],min:P[i][4],exemplo:true});
    var d=new Date(),a=ymd(new Date(d.getFullYear(),d.getMonth(),Math.max(1,d.getDate()-6)));
    await api.add('cash',{tipo:'entrada',desc:'Venda de camisetas',cat:'Venda',valor:240,data:a,exemplo:true});
    await api.add('cash',{tipo:'saida',desc:'Gasolina do rolê de domingo',cat:'Evento',valor:180,data:today(),exemplo:true});
    toast('Exemplos carregados.');
  })},
  limpar:function(){safe(async function(){
    var ids=[];
    S.rows.products.filter(function(p){return p.exemplo}).forEach(function(p){ids.push(['products',p.id])});
    S.rows.cash.filter(function(x){return x.exemplo}).forEach(function(x){ids.push(['cash',x.id])});
    for(var i=0;i<ids.length;i++)await api.del(ids[i][0],ids[i][1]);
    toast('Exemplos removidos.');
  })}
};
var forms={
  setup:async function(f){
    var fd=Object.fromEntries(new FormData(f)),e=$('#lerr');
    try{
      if(S.rows.members.length)throw new Error('O primeiro acesso já foi criado. Entre com seu usuário.');
      need(fd.nome,'Informe o nome completo.');need(fd.apelido,'Informe o apelido de estrada.');need(fd.login,'Informe o usuário de login.');
      if((fd.pw||'').length<6)throw new Error('A senha precisa ter ao menos 6 caracteres.');
      if(fd.pw!==fd.pw2)throw new Error('As senhas não conferem.');
      var salt=newSalt();
      var id=await api.add('members',{nome:fd.nome.trim(),apelido:fd.apelido.trim(),cargo:'President',login:fd.login.trim().toLowerCase(),salt:salt,hash:await hashPw(fd.pw,salt),ativo:true,patches:[],foto:''});
      sid=id;saveSession(id);ui.view='painel';render();
    }catch(err){e.textContent=errMsg(err);e.hidden=false}
  },
  login:async function(f){
    var fd=Object.fromEntries(new FormData(f)),e=$('#lerr');
    var show=function(t){e.textContent=t;e.hidden=false};
    try{
      if(Date.now()<lockUntil){show('Muitas tentativas. Aguarde '+Math.ceil((lockUntil-Date.now())/1000)+'s.');return}
      var login=String(fd.login||'').trim().toLowerCase();
      var u=S.rows.members.find(function(x){return String(x.login||'').toLowerCase()===login&&x.hash});
      var h=await hashPw(fd.pw||'',u?u.salt:'00000000000000000000000000000000');
      if(!u||h!==u.hash||u.ativo===false){
        if(++fails>=5){fails=0;lockUntil=Date.now()+30000;show('Muitas tentativas. Aguarde 30s.')}
        else show(u&&u.ativo===false&&h===u.hash?'Este acesso está inativo.':'Usuário ou senha incorretos.');
        return;
      }
      fails=0;sid=u.id;saveSession(u.id);ui.view='painel';render();
    }catch(err){show(errMsg(err))}
  },
  lanc:function(f){safe(async function(){
    if(!canWrite())throw new Error('Sem permissão para lançar no caixa.');
    var fd=Object.fromEntries(new FormData(f)),e=$('#ferr');e.hidden=true;
    try{
      var ped=fd.pedido?find('pedidos',fd.pedido):null;
      if(fd.pedido&&!ped)throw new Error('Pedido não encontrado.');
      if(ped&&fd.tipo!=='entrada')throw new Error('Só entradas podem ser ligadas a um pedido.');
      var desc=String(fd.desc||'').trim();
      if(!desc&&ped)desc='Adiantamento · pedido '+pNum(ped);
      need(desc,'Descreva o lançamento.');
      var v=num(fd.valor,'Informe um valor maior que zero.',0.01);
      need(fd.data,'Informe a data.');
      if(ped&&r2(v)>pRest(ped))throw new Error('O valor passa do que falta no pedido ('+brl(pRest(ped))+').');
      var rec={tipo:fd.tipo,desc:desc,cat:ped?'Pedido':fd.cat,valor:r2(v),data:fd.data};
      if(ped)rec.pedidoId=ped.id;
      await api.add('cash',rec);
      toast('Lançamento registrado.');
    }catch(err){e.textContent=errMsg(err);e.hidden=false}
  })}
};

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act;
  if(Object.prototype.hasOwnProperty.call(ACT_MAX,a)){var u=U();if(!u||rank(u.cargo)>ACT_MAX[a]){toast(ACT_MAX[a]>=7?'Prospects não mexem em pedidos.':(ACT_MAX[a]>=6?'Só Sergeant at Arms ou superior faz isso.':'Só President, Vice President, Secretary e Treasurer fazem isso.'),true);return}}
  var h=handlers[a];if(h)h(t.dataset.id,t,e);
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();forms[f.dataset.form](f);
});
document.addEventListener('input',function(e){
  var t=e.target.closest('[data-filter]');if(!t)return;
  ui[t.dataset.filter]=t.value;refreshList(t.dataset.filter);
});
document.addEventListener('change',function(e){
  var t=e.target;if(!t||t.id!=='pfoto')return;
  var file=t.files&&t.files[0];if(!file)return;
  var m=find('members',ui.perfilId);if(!m||!canPhoto(m)){t.value='';return}
  safe(async function(){
    var foto=await resizePhoto(file);
    await api.put('members',m.id,{foto:foto});
    toast('Foto atualizada.');render();
  });
  t.value='';
});
document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;if(!$('#modal').hidden)closeModal();else handlers.closeNav()});

render();
initStore().then(function(){loadSession();render();initRoom()});
})();
